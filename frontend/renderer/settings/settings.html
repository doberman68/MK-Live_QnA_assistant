<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Settings — MK Live Q&A</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>

  <header>
    <h1>Settings</h1>
  </header>

  <form id="settings-form">

    <!-- Audio -->
    <div class="section">
      <div class="section-title">Audio Source</div>
      <div class="field">
        <label for="audio-source">Capture from</label>
        <select id="audio-source" name="audio_source">
          <option value="mic">Microphone only</option>
          <option value="loopback">System audio (loopback)</option>
          <option value="both">Both mic + system audio</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label for="mic-device">Microphone device</label>
          <select id="mic-device" name="mic_device_index">
            <option value="">Default</option>
          </select>
        </div>
        <div class="field">
          <label for="loopback-device">Loopback device</label>
          <select id="loopback-device" name="loopback_device_index">
            <option value="">Default</option>
          </select>
        </div>
      </div>
      <p class="hint">macOS: Install BlackHole and select it as the loopback device. Windows: WASAPI loopback devices appear automatically.</p>
    </div>

    <!-- Speech-to-Text -->
    <div class="section">
      <div class="section-title">Speech-to-Text</div>
      <div class="row">
        <div class="field">
          <label for="stt-provider">Engine</label>
          <select id="stt-provider" name="stt_provider">
            <option value="local_whisper">Local Whisper (offline)</option>
            <option value="openai_api">OpenAI Whisper API</option>
          </select>
        </div>
        <div class="field">
          <label for="whisper-model">Whisper model size</label>
          <select id="whisper-model" name="whisper_model_size">
            <option value="tiny">Tiny (fastest)</option>
            <option value="base" selected>Base (recommended)</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large (best accuracy)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- LLM -->
    <div class="section">
      <div class="section-title">Language Model</div>
      <div class="field">
        <label for="llm-provider">Provider</label>
        <select id="llm-provider" name="llm_provider">
          <option value="ollama">Ollama (local / free)</option>
          <option value="openai">OpenAI (GPT)</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>

      <!-- Ollama -->
      <div id="fields-ollama" class="provider-fields">
        <div class="row">
          <div class="field">
            <label for="ollama-url">Ollama URL</label>
            <input type="text" id="ollama-url" name="ollama_base_url" placeholder="http://localhost:11434" />
          </div>
          <div class="field">
            <label for="ollama-model">Model</label>
            <select id="ollama-model" name="ollama_model">
              <option value="llama3">llama3</option>
            </select>
          </div>
        </div>
        <button type="button" id="refresh-ollama-btn" class="btn btn-secondary" style="align-self:flex-start">Refresh models</button>
      </div>

      <!-- OpenAI -->
      <div id="fields-openai" class="provider-fields">
        <div class="row">
          <div class="field">
            <label for="openai-key">API Key</label>
            <input type="password" id="openai-key" name="openai_api_key" placeholder="sk-..." />
          </div>
          <div class="field">
            <label for="openai-model">Model</label>
            <select id="openai-model" name="openai_model">
              <option value="gpt-4o-mini">gpt-4o-mini</option>
              <option value="gpt-4o">gpt-4o</option>
              <option value="gpt-4-turbo">gpt-4-turbo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Anthropic -->
      <div id="fields-anthropic" class="provider-fields">
        <div class="row">
          <div class="field">
            <label for="anthropic-key">API Key</label>
            <input type="password" id="anthropic-key" name="anthropic_api_key" placeholder="sk-ant-..." />
          </div>
          <div class="field">
            <label for="anthropic-model">Model</label>
            <select id="anthropic-model" name="anthropic_model">
              <option value="claude-3-haiku-20240307">Claude 3 Haiku (fast)</option>
              <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
              <option value="claude-opus-4-7">Claude Opus 4</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Gemini -->
      <div id="fields-gemini" class="provider-fields">
        <div class="row">
          <div class="field">
            <label for="gemini-key">API Key</label>
            <input type="password" id="gemini-key" name="gemini_api_key" placeholder="AIza..." />
          </div>
          <div class="field">
            <label for="gemini-model">Model</label>
            <select id="gemini-model" name="gemini_model">
              <option value="gemini-1.5-flash">Gemini 1.5 Flash (fast)</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Behavior -->
    <div class="section">
      <div class="section-title">Behavior</div>
      <div class="row">
        <div class="field">
          <label for="lookback">Manual mode lookback (seconds)</label>
          <input type="number" id="lookback" name="manual_lookback_seconds" min="10" max="300" value="45" />
        </div>
        <div class="field">
          <label for="auto-interval">Auto mode check interval (seconds)</label>
          <input type="number" id="auto-interval" name="auto_check_interval_seconds" min="3" max="60" value="5" />
        </div>
      </div>
    </div>

  </form>

  <footer>
    <span class="saved-msg" id="saved-msg">Saved!</span>
    <button type="button" class="btn btn-secondary" id="cancel-btn">Close</button>
    <button type="submit" form="settings-form" class="btn btn-primary">Save Settings</button>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
